spring:
  application:
    name: inventario

  datasource:
    url: jdbc:postgresql://localhost:5434/inventario
    username: ${DB_USER:inventario}
    password: ${DB_PASSWORD:inventario}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 12h
    admin:
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
  storage:
    root: ${STORAGE_ROOT:${user.home}/inventario-uploads}
  evidencia:
    obligatoria: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  address: 127.0.0.1

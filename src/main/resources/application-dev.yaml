spring:
  application:
    name: inventario

  datasource:
    url: jdbc:postgresql://localhost:5434/inventario
    username: ${DB_USER:inventario}
    password: ${DB_PASSWORD:inventario}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  storage:
    root: ${STORAGE_ROOT:${user.home}/inventario-uploads}
  evidencia:
    obligatoria: true

server:
  address: 127.0.0.1

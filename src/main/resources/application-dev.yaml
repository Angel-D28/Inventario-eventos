spring:
  application:
    name: inventario

  datasource:
    url: jdbc:postgresql://localhost:5434/inventario
    username: ${DB_USER:inventario}
    password: ${DB_PASSWORD:inventario}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  security:
    jwt:
      secret: dev-only-secret-change-me-0123456789abcdef
      expiration: 10s
    admin:
      username: dev
      password: dev-password-123
  storage:
    root: ${STORAGE_ROOT:${user.home}/inventario-uploads}
  evidencia:
    obligatoria: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  address: 127.0.0.1
